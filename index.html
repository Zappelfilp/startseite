<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Startseite</title>
  <base target="_blank">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="container">
    <!-- Google Logo / Titel -->
    <h1 class="logo">Google</h1>

    <!-- Beides Suchfelder nebeneinander -->
    <div style="display: flex; gap: 15px; max-width: 800px; margin: 0 auto 35px auto;">
      
      <!-- Google Suche -->
      <form action="https://www.google.com/search" method="GET" style="flex: 1;">
        <input type="text" name="q" placeholder="Auf Google suchen..." autofocus required style="width: 100%; padding: 12px 18px; font-size: 15px; border-radius: 20px; border: 1px solid #333333; background-color: #1e1e1e; color: #ffffff; box-sizing: border-box;">
      </form>

      <!-- Gemini Suche -->
      <form action="https://gemini.google.com/app" method="GET" style="flex: 1;">
        <input type="text" name="q" placeholder="Gemini fragen..." required style="width: 100%; padding: 12px 18px; font-size: 15px; border-radius: 20px; border: 1px solid #333333; background-color: #1e1e1e; color: #ffffff; box-sizing: border-box;">
      </form>
    <!-- 3-Spalten Layout -->
    <div class="columns-wrapper">

      <!-- Spalte 1: Web-Links -->
      <section class="column">
        <h2>Web Links</h2>
        <div class="grid">
          <a href="https://youtube.com" class="card" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="YouTube">
            <span>YouTube</span>
          </a>
          <a href="https://gmail.com" class="card" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=gmail.com&sz=64" alt="Gmail">
            <span>Gmail</span>
          </a>
          <a href="https://reddit.com" class="card" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=reddit.com&sz=64" alt="Reddit">
            <span>Reddit</span>
          </a>
          <a href="https://github.com" class="card" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=64" alt="GitHub">
            <span>GitHub</span>
            </a>
          <a href="https://wip.lwk-rlp.de/" class="card" target="_blank">
            <img src="https://wip.lwk-rlp.de/s2/favicons?domain=wip.lwk-rlp.de/&sz=64" alt="LWK">
            <span>LWK</span>
          </a>
        </div>
      </section>

      <!-- Spalte 2: Heimnetz (IP-Adressen) -->
      <section class="column">
        <h2>Heimnetz & Smart Home</h2>
        <div class="grid">
          <a href="http://192.168.178.1" class="card" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=avm.de&sz=64" alt="FritzBox">
            <span>FritzBox</span>
          </a>
          <a href="http://192.168.178.50:8080" class="card" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=synology.com&sz=64" alt="NAS Server">
            <span>NAS Server</span>
          </a>
          <a href="http://192.168.178.8123" class="card" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=home-assistant.io&sz=64" alt="Home Assistant">
            <span>Home Assistant</span>
          </a>
          <a href="http://192.168.178.100" class="card" target="_blank">
            <img src="https://www.google.com/s2/favicons?domain=pi-hole.net&sz=64" alt="Pi-hole">
            <span>Pi-hole</span>
          </a>
        </div>
      </section>

      <!-- Spalte 3: Google Monatskalender -->
      <section class="column">
        <h2>Monatskalender</h2>
        <div class="calendar-container">
          <iframe 
            src="https://calendar.google.com/calendar/embed?height=400&wkst=2&ctz=Europe%2FBerlin&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0&showTz=0&mode=MONTH&src=abagnaler%40gmail.com" 
            style="border:0; width:100%; height:400px;" 
            frameborder="0" 
            scrolling="no">
          </iframe>
        </div>
      </section>

    </div>
  </div>

</body>
</html>
